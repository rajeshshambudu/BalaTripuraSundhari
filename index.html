
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nimeshika • Wonderful World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg,#ffafcc,#cdb4db);
    overflow: hidden;
    color: white;
    text-align: center;
}

/* Intro */
#intro {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle,#ffe6f0,#cdb4db);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2em;
    z-index: 99;
    animation: fadeOut 5s forwards;
}

@keyframes fadeOut {
    0%,70% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
}

/* Name Animation */
.name span {
    display: inline-block;
    animation: bounce 2s infinite;
}
.name span:nth-child(n) {
    animation-delay: calc(var(--i) * 0.1s);
}
@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Confetti */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    background: pink;
    top: -10px;
    animation: fall linear forwards;
}

@keyframes fall {
    from { transform: translateY(-10px) rotate(0deg); opacity:1; }
    to { transform: translateY(110vh) rotate(720deg); opacity:0; }
}

/* Button */
#playBtn {
    padding: 15px 25px;
    font-size: 1.1em;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg,#ffafcc,#ffc8dd);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin: 20px;
}

footer {
    padding: 20px;
    opacity: 0.85;
}
</style>
</head>

<body>

<div id="intro">✨ Welcome to Nimeshika’s Wonderful World ✨</div>

<h1 class="name">
  <span style="--i:1">N</span>
  <span style="--i:2">i</span>
  <span style="--i:3">m</span>
  <span style="--i:4">e</span>
  <span style="--i:5">s</span>
  <span style="--i:6">h</span>
  <span style="--i:7">i</span>
  <span style="--i:8">k</span>
  <span style="--i:9">a</span>
</h1>

<h2>Happy 4 Months 🎀</h2>
<p>Our little miracle 💕</p>

<button id="playBtn">🎉 Play Music 🎉</button>

<!-- Hidden YouTube audio -->
<iframe id="yt"
  width="1" height="1"
  style="opacity:0; position:absolute; pointer-events:none;"
  src=""
  allow="autoplay">
</iframe>

<footer>
Wonderful World ✨<br>
Made with endless love 💖
</footer>

<script>
/* START MUSIC ON TAP */
document.getElementById("playBtn").onclick = () => {
    document.getElementById("yt").src =
      "https://www.youtube.com/embed/WJ3-F02-F_Y?autoplay=1";
};

/* NON-STOP BLASTING PAPERS */
function createConfetti() {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background =
      ["#ffafcc","#cdb4db","#fff","#ffc8dd"]
      [Math.floor(Math.random()*4)];
    c.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
}

/* Continuous blasting */
setInterval(createConfetti, 80);
</script>

</body>
</html>
