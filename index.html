
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nimeshika’s Universe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --space-deep: #020617;
        }

        body {
            margin: 0;
            font-family: 'Quicksand', sans-serif;
            background-color: var(--space-deep);
            overflow: hidden;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none; /* Custom star-dust cursor */
        }

        /* Initial Screen */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--space-deep);
            transition: opacity 2s ease;
            cursor: auto;
        }

        #initialWishBtn {
            padding: 20px 40px;
            font-size: 1.2rem;
            background: transparent;
            color: white;
            border: 2px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            letter-spacing: 3px;
            transition: 0.5s;
        }

        #initialWishBtn:hover {
            background: white;
            color: var(--space-deep);
            box-shadow: 0 0 40px white;
        }

        /* Main Content Layer */
        #mainContent {
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 3s ease;
            text-align: center;
            z-index: 10;
        }

        /* The Moon Portal */
        .moon {
            width: 200px;
            height: 200px;
            background: #111; /* Fallback if video fails */
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.2);
            margin-bottom: 25px;
            animation: moonPulse 4s infinite ease-in-out;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.2);
        }

        #moonVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        @keyframes moonPulse {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.5);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 70px rgba(255, 255, 255, 0.4), inset 0 0 10px rgba(0,0,0,0.2);
                transform: scale(1.05);
            }
        }

        /* Floating Text Effects */
        .name {
            font-size: clamp(2.5rem, 8vw, 4rem);
            letter-spacing: 12px;
            margin: 10px 0;
            font-weight: 300;
        }

        .name span {
            display: inline-block;
            animation: floatAndGlow 4s infinite ease-in-out;
            animation-delay: calc(var(--i) * 0.1s);
        }

        @keyframes floatAndGlow { 
            0%, 100% { transform: translateY(0); text-shadow: 0 0 5px rgba(255,255,255,0.2); } 
            50% { transform: translateY(-15px); text-shadow: 0 0 25px rgba(255,255,255,0.8); } 
        }

        #countdown {
            margin: 15px 0;
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        /* Input Controls */
        .wish-container {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            outline: none;
            backdrop-filter: blur(5px);
        }

        .send-btn {
            background: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        /* Visual Particles */
        .star-dot {
            position: absolute;
            background: white;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        .cursor-sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
        }

        .wish-star {
            position: absolute;
            white-space: nowrap;
            color: #fff;
            text-shadow: 0 0 10px #fff;
            pointer-events: none;
            font-size: 1.1rem;
        }

        @keyframes twinkle { from { opacity: 0.3; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="startScreen">
    <button id="initialWishBtn">✨ Make a Wish for Nimeshika ✨</button>
</div>

<div id="mainContent">
    <div class="moon">
        <video id="moonVideo" muted loop playsinline preload="auto">
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>
    
    <h1 class="name">
        <span style="--i:1">N</span><span style="--i:2">i</span><span style="--i:3">m</span><span style="--i:4">e</span><span style="--i:5">s</span><span style="--i:6">h</span><span style="--i:7">i</span><span style="--i:8">k</span><span style="--i:9">a</span>
    </h1>
    
    <h2>Happy 4 Months</h2>
    <div id="countdown"></div>

    <div class="wish-container">
        <input type="text" id="wishInput" placeholder="Write a wish...">
        <button class="send-btn" onclick="sendWish()">Send 🌠</button>
    </div>
</div>

<iframe id="yt" width="1" height="1" style="display:none;" src="" allow="autoplay"></iframe>

<script>
const startScreen = document.getElementById('startScreen');
const mainContent = document.getElementById('mainContent');
const initialWishBtn = document.getElementById('initialWishBtn');
const moonVideo = document.getElementById('moonVideo');

// 1. UNIVERSE ACTIVATION
initialWishBtn.onclick = () => {
    // Start Video (Modern browsers require user click to play)
    moonVideo.play().catch(error => {
        console.log("Video playback failed. Check if 'video.mp4' exists.", error);
    });

    // Start Music
    document.getElementById('yt').src = "https://www.youtube.com/embed/WJ3-F02-F_Y?autoplay=1&loop=1&playlist=WJ3-F02-F_Y";
    
    // Smooth Transitions
    startScreen.style.opacity = '0';
    setTimeout(() => {
        startScreen.style.display = 'none';
        mainContent.style.opacity = '1';
        initStars();
        setInterval(createShootingStar, 4000);
    }, 2000);
};

// 2. GENERATE BACKGROUND STARS
function initStars() {
    for (let i = 0; i < 150; i++) {
        let star = document.createElement('div');
        star.className = 'star-dot';
        const size = Math.random() * 2 + 'px';
        star.style.width = size;
        star.style.height = size;
        star.style.top = Math.random() * 100 + 'vh';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.animation = `twinkle ${Math.random() * 3 + 2}s infinite alternate`;
        document.body.appendChild(star);
    }
}

// 3. MOUSE SPARKLE EFFECT
document.addEventListener('mousemove', (e) => {
    const sparkle = document.createElement('div');
    sparkle.className = 'cursor-sparkle';
    sparkle.style.left = e.clientX + 'px';
    sparkle.style.top = e.clientY + 'px';
    document.body.appendChild(sparkle);

    const destX = (Math.random() - 0.5) * 60;
    const destY = (Math.random() - 0.5) * 60;

    sparkle.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${destX}px, ${destY}px) scale(0)`, opacity: 0 }
    ], { duration: 800, easing: 'ease-out' });

    setTimeout(() => sparkle.remove(), 800);
});

// 4. FLOATING WISHES
function sendWish() {
    const input = document.getElementById('wishInput');
    if (!input.value.trim()) return;
    
    const wish = document.createElement('div');
    wish.className = 'wish-star';
    wish.innerText = "✦ " + input.value;
    wish.style.top = (Math.random() * 60 + 20) + 'vh';
    wish.style.left = '110vw';
    document.body.appendChild(wish);
    
    wish.animate([{ left: '110vw' }, { left: '-120vw' }], { 
        duration: 15000, 
        easing: 'linear' 
    });
    
    setTimeout(() => wish.remove(), 15000);
    input.value = '';
}

// 5. SHOOTING STARS
function createShootingStar() {
    const s = document.createElement('div');
    s.style.position = 'absolute';
    s.style.width = '2px';
    s.style.height = '100px';
    s.style.background = 'linear-gradient(to bottom, white, transparent)';
    s.style.top = '-100px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.transform = 'rotate(225deg)';
    document.body.appendChild(s);
    
    s.animate([
        { transform: 'translate(0,0) rotate(45deg)', opacity: 1 },
        { transform: 'translate(-600px, 1200px) rotate(45deg)', opacity: 0 }
    ], { duration: 2500 });
    
    setTimeout(() => s.remove(), 2500);
}

// 6. COUNTDOWN (Set for 5-month milestone)
function updateCountdown() {
    const target = new Date("Jan 27, 2026 00:00:00").getTime();
    const now = new Date().getTime();
    const gap = target - now;
    
    const d = Math.floor(gap / (1000 * 60 * 60 * 24));
    const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((gap % (1000 * 60)) / 1000);
    
    document.getElementById("countdown").innerHTML = `5 Month Milestone in: ${d}d ${h}h ${m}m ${s}s`;
}
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
