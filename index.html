
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nimeshika • Celestial World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500&display=swap" rel="stylesheet">

<style>
:root {
    --space-deep: #050b18;
    --star-bright: #ffffff;
    --nebula-glow: rgba(138, 43, 226, 0.2);
}

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background-color: var(--space-deep);
    overflow: hidden;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Background Layers */
.nebula {
    position: fixed;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--nebula-glow) 0%, transparent 70%);
    z-index: -1;
    filter: blur(50px);
    animation: pulse 10s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); opacity: 0.5; }
    to { transform: scale(1.3); opacity: 0.8; }
}

/* Shooting Stars */
.shooting-star {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 2px;
    background: linear-gradient(-45deg, #fff, rgba(0, 0, 255, 0));
    filter: drop-shadow(0 0 6px #fff);
    animation: tail 3s ease-in-out infinite, shooting 3s ease-in-out infinite;
}

@keyframes tail {
    0% { width: 0; }
    30% { width: 100px; }
    100% { width: 0; }
}

@keyframes shooting {
    0% { transform: translateX(0) translateY(0) rotate(45deg); }
    100% { transform: translateX(-1000px) translateY(1000px) rotate(45deg); }
}

/* The Moon */
.moon {
    width: 100px;
    height: 100px;
    background: #fdfcf0;
    border-radius: 50%;
    box-shadow: 
        0 0 40px rgba(255, 255, 255, 0.2),
        inset -15px -10px 30px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    z-index: 2;
}

/* Typography */
.name {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 300;
    letter-spacing: 12px;
    margin: 10px 0;
}

.name span {
    display: inline-block;
    animation: float 4s infinite ease-in-out;
    animation-delay: calc(var(--i) * 0.1s);
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Button & UI */
#playBtn {
    padding: 12px 40px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    border-radius: 30px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: 0.4s;
    margin-top: 20px;
}

#playBtn:hover {
    background: white;
    color: black;
    box-shadow: 0 0 25px rgba(255,255,255,0.6);
}

footer {
    position: fixed;
    bottom: 30px;
    font-size: 0.9rem;
    letter-spacing: 3px;
    opacity: 0.6;
}
</style>
</head>
<body>

<div class="nebula"></div>

<div class="moon"></div>

<h1 class="name">
  <span style="--i:1">N</span><span style="--i:2">i</span><span style="--i:3">m</span><span style="--i:4">e</span><span style="--i:5">s</span><span style="--i:6">h</span><span style="--i:7">i</span><span style="--i:8">k</span><span style="--i:9">a</span>
</h1>

<h2>Happy 4 Months</h2>
<p>Our little star in the vast universe ✨</p>

<button id="playBtn">Play Moonlight Music</button>

<iframe id="yt" width="1" height="1" style="display:none;" src="" allow="autoplay"></iframe>

<footer>
WONDERFUL WORLD
</footer>

<script>
// Create Stars
function initStars() {
    for (let i = 0; i < 150; i++) {
        let star = document.createElement('div');
        star.style.position = 'absolute';
        star.style.width = Math.random() * 2 + 'px';
        star.style.height = star.style.width;
        star.style.background = 'white';
        star.style.borderRadius = '50%';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.opacity = Math.random();
        star.style.animation = `twinkle ${Math.random() * 3 + 2}s infinite alternate`;
        document.body.appendChild(star);
    }
}

// Create occasional Shooting Stars
function createShootingStar() {
    const s = document.createElement('div');
    s.className = 'shooting-star';
    s.style.top = Math.random() * 50 + '%';
    s.style.left = Math.random() * 100 + '%';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3000);
}

setInterval(createShootingStar, 4000);
initStars();

// Music logic
document.getElementById("playBtn").onclick = function() {
    document.getElementById("yt").src = "https://www.youtube.com/embed/WJ3-F02-F_Y?autoplay=1&loop=1&playlist=WJ3-F02-F_Y";
    this.style.display = 'none';
};
</script>

<style>
@keyframes twinkle {
    from { opacity: 0.2; transform: scale(1); }
    to { opacity: 1; transform: scale(1.2); }
}
</style>

</body>
</html>
