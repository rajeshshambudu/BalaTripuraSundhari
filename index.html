
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nimeshika’s Universe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500&display=swap" rel="stylesheet">

<style>
:root {
    --space-deep: #020617;
}

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background-color: var(--space-deep);
    overflow: hidden;
    color: white;
    height: 100vh;
}

/* Background Video Styling */
#universeVideo {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    z-index: -2; /* Behind everything */
    opacity: 0; /* Hidden initially */
    transition: opacity 3s ease;
    object-fit: cover;
    filter: brightness(0.6); /* Makes text easier to read */
}

/* Initial Screen */
#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--space-deep);
    transition: opacity 2s ease;
}

#initialWishBtn {
    padding: 20px 40px;
    font-size: 1.2rem;
    background: transparent;
    color: white;
    border: 2px solid #fff;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
    letter-spacing: 3px;
    transition: 0.5s;
}

#initialWishBtn:hover {
    background: white;
    color: var(--space-deep);
    box-shadow: 0 0 40px white;
}

/* Content Layout */
#mainContent {
    opacity: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 3s ease;
    text-align: center;
}

.moon {
    width: 90px;
    height: 90px;
    background: #fdfcf0;
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.3), inset -10px -10px 20px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    z-index: 1;
}

.name {
    font-size: clamp(2.5rem, 8vw, 4rem);
    letter-spacing: 12px;
    font-weight: 300;
    margin: 10px 0;
    text-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.name span {
    display: inline-block;
    animation: float 4s infinite ease-in-out;
    animation-delay: calc(var(--i) * 0.1s);
}

.wish-container {
    margin-top: 30px;
    display: flex;
    gap: 10px;
    z-index: 10;
}

input {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 15px;
    border-radius: 20px;
    color: white;
    outline: none;
    backdrop-filter: blur(5px);
}

.send-btn {
    background: white;
    color: black;
    border: none;
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
}

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>

<video id="universeVideo" loop muted playsinline>
    <source src="your-video-name.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div id="startScreen">
    <button id="initialWishBtn">✨ Make a Wish for Nimeshika ✨</button>
</div>

<div id="mainContent">
    <div class="moon" id="moon"></div>
    
    <h1 class="name">
        <span style="--i:1">N</span><span style="--i:2">i</span><span style="--i:3">m</span><span style="--i:4">e</span><span style="--i:5">s</span><span style="--i:6">h</span><span style="--i:7">i</span><span style="--i:8">k</span><span style="--i:9">a</span>
    </h1>
    
    <h2>Happy 4 Months ✨</h2>
    <div id="countdown" style="margin: 10px; font-size: 0.9rem; opacity: 0.9;"></div>

    <div class="wish-container">
        <input type="text" id="wishInput" placeholder="Add another wish...">
        <button class="send-btn" onclick="sendWish()">Send 🌠</button>
    </div>
</div>

<iframe id="yt" width="1" height="1" style="display:none;" src="" allow="autoplay"></iframe>

<script>
const video = document.getElementById('universeVideo');
const startScreen = document.getElementById('startScreen');
const mainContent = document.getElementById('mainContent');
const initialWishBtn = document.getElementById('initialWishBtn');

initialWishBtn.onclick = () => {
    // 1. Play Video
    video.play();
    video.style.opacity = '0.6';

    // 2. Start Music
    document.getElementById('yt').src = "https://www.youtube.com/embed/WJ3-F02-F_Y?autoplay=1&loop=1&playlist=WJ3-F02-F_Y";
    
    // 3. Transitions
    startScreen.style.opacity = '0';
    setTimeout(() => {
        startScreen.style.display = 'none';
        mainContent.style.opacity = '1';
        initStars();
    }, 2000);
};

function initStars() {
    for (let i = 0; i < 100; i++) {
        let star = document.createElement('div');
        star.style.position = 'absolute';
        star.style.width = '1px';
        star.style.height = '1px';
        star.style.background = 'white';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.opacity = Math.random();
        star.style.zIndex = "-1";
        document.body.appendChild(star);
    }
}

function sendWish() {
    const input = document.getElementById('wishInput');
    if (!input.value) return;
    const wish = document.createElement('div');
    wish.style.position = 'absolute';
    wish.style.color = 'white';
    wish.style.textShadow = '0 0 10px white';
    wish.innerText = "✧ " + input.value;
    wish.style.top = (Math.random() * 50 + 20) + 'vh';
    wish.style.left = '110vw';
    document.body.appendChild(wish);
    wish.animate([{ left: '110vw' }, { left: '-100vw' }], { duration: 12000 });
    setTimeout(() => wish.remove(), 12000);
    input.value = '';
}

function updateCountdown() {
    const nextMilestone = new Date("Jan 27, 2026 00:00:00").getTime();
    const now = new Date().getTime();
    const gap = nextMilestone - now;
    const d = Math.floor(gap / (1000 * 60 * 60 * 24));
    const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((gap % (1000 * 60)) / 1000);
    document.getElementById("countdown").innerHTML = `5 Month Celebration in: ${d}d ${h}h ${m}m ${s}s`;
}
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
