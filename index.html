<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nimeshika • 4 Months in the Stars</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500&display=swap" rel="stylesheet">

<style>
:root {
    --space-deep: #050b18;
    --star-color: #ffffff;
}

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background-color: var(--space-deep);
    overflow: hidden;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Background Nebula */
.nebula {
    position: fixed;
    width: 80vw;
    height: 80vw;
    background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%);
    z-index: -1;
    filter: blur(60px);
}

/* Interactive Moon */
.moon {
    width: 110px;
    height: 110px;
    background: #fdfcf0;
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.2), inset -15px -10px 30px rgba(0,0,0,0.1);
    cursor: pointer;
    z-index: 10;
    transition: transform 0.3s ease;
}

.moon:active { transform: scale(0.9); }

/* Shooting Stars */
.shooting-star {
    position: absolute;
    height: 2px;
    background: linear-gradient(-45deg, #fff, rgba(0, 0, 255, 0));
    filter: drop-shadow(0 0 6px #fff);
    pointer-events: none;
}

/* Typography */
.name {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 300;
    letter-spacing: 12px;
    margin: 20px 0 10px 0;
}

.name span {
    display: inline-block;
    animation: float 4s infinite ease-in-out;
    animation-delay: calc(var(--i) * 0.1s);
}

/* Countdown Styling */
#countdown {
    margin-top: 20px;
    font-weight: 300;
    letter-spacing: 2px;
    background: rgba(255, 255, 255, 0.05);
    padding: 10px 20px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

#playBtn {
    padding: 12px 40px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 25px;
}

/* Rainbow Effect Class */
.rainbow-star {
    animation: rainbow 3s infinite linear !important;
}

@keyframes rainbow {
    0% { background: #ffadad; box-shadow: 0 0 5px #ffadad; }
    25% { background: #ffd6a5; box-shadow: 0 0 5px #ffd6a5; }
    50% { background: #caffbf; box-shadow: 0 0 5px #caffbf; }
    75% { background: #9bf6ff; box-shadow: 0 0 5px #9bf6ff; }
    100% { background: #ffadad; box-shadow: 0 0 5px #ffadad; }
}

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>

<div class="nebula"></div>

<div class="moon" title="Click me for magic!" id="moon"></div>

<h1 class="name">
  <span style="--i:1">N</span><span style="--i:2">i</span><span style="--i:3">m</span><span style="--i:4">e</span><span style="--i:5">s</span><span style="--i:6">h</span><span style="--i:7">i</span><span style="--i:8">k</span><span style="--i:9">a</span>
</h1>

<h2>Happy 4 Months ✨</h2>

<div id="countdown">Calculating next milestone...</div>

<button id="playBtn">Play Moonlight Music</button>

<iframe id="yt" width="1" height="1" style="display:none;" src="" allow="autoplay"></iframe>

<script>
// Initialize Stars
const starCount = 150;
function initStars() {
    for (let i = 0; i < starCount; i++) {
        let star = document.createElement('div');
        star.className = 'star-dot';
        star.style.position = 'absolute';
        star.style.width = Math.random() * 2 + 'px';
        star.style.height = star.style.width;
        star.style.background = 'white';
        star.style.borderRadius = '50%';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.opacity = Math.random();
        star.style.zIndex = "1";
        document.body.appendChild(star);
    }
}

// Rainbow Toggle
document.getElementById('moon').onclick = function() {
    const stars = document.querySelectorAll('.star-dot');
    stars.forEach(s => s.classList.toggle('rainbow-star'));
};

// Countdown Logic (Target: 5 Month Milestone)
function updateCountdown() {
    // Set this to Nimeshika's birth date + 5 months
    // Example: If she turned 4 months on Dec 27, her 5 months is Jan 27
    const nextMilestone = new Date("Jan 27, 2026 00:00:00").getTime();
    const now = new Date().getTime();
    const gap = nextMilestone - now;

    const d = Math.floor(gap / (1000 * 60 * 60 * 24));
    const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((gap % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML = 
        `Next Milestone in: ${d}d ${h}h ${m}m ${s}s 🎀`;
}

// Shooting Star Animation
function createShootingStar() {
    const s = document.createElement('div');
    s.className = 'shooting-star';
    s.style.top = Math.random() * 50 + '%';
    s.style.left = Math.random() * 100 + '%';
    s.style.width = '150px';
    s.style.transform = 'rotate(45deg)';
    document.body.appendChild(s);
    
    s.animate([
        { transform: 'translateX(0) translateY(0) rotate(45deg)', opacity: 1 },
        { transform: 'translateX(-800px) translateY(800px) rotate(45deg)', opacity: 0 }
    ], { duration: 2000, easing: 'ease-in-out' });

    setTimeout(() => s.remove(), 2000);
}

setInterval(updateCountdown, 1000);
setInterval(createShootingStar, 5000);
initStars();

document.getElementById("playBtn").onclick = function() {
    document.getElementById("yt").src = "https://www.youtube.com/embed/WJ3-F02-F_Y?autoplay=1&loop=1&playlist=WJ3-F02-F_Y";
    this.style.display = 'none';
};
</script>

</body>
</html>
