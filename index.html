<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nimeshika • Celestial World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500&display=swap" rel="stylesheet">

<style>
:root {
    --space-deep: #020617;
    --nebula-purple: #3b0764;
    --star-gold: #fde047;
}

body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background-color: var(--space-deep);
    background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
    overflow: hidden;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Background Video Layer */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    z-index: -2;
    transform: translate(-50%, -50%);
    opacity: 0.4; /* Soft blending with the gradient */
    filter: brightness(0.8) contrast(1.2);
}

/* Star Field Animation */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle var(--duration) infinite ease-in-out;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); }
}

/* Glowing Moon */
.moon {
    width: 120px;
    height: 120px;
    background: #fefce8;
    border-radius: 50%;
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.3), inset -20px -20px 50px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
}

/* Intro Overlay */
#intro {
    position: fixed;
    inset: 0;
    background: var(--space-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8em;
    z-index: 999;
    letter-spacing: 3px;
    animation: fadeOut 4s forwards cubic-bezier(0.7, 0, 0.3, 1);
}

@keyframes fadeOut {
    0%, 60% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
}

/* Typography */
.name {
    font-size: 4em;
    font-weight: 300;
    margin: 10px 0;
    letter-spacing: 10px;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

.name span {
    display: inline-block;
    animation: float 4s infinite ease-in-out;
    animation-delay: calc(var(--i) * 0.1s);
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

h2 { font-weight: 300; opacity: 0.9; letter-spacing: 2px; }

/* Modern Button */
#playBtn {
    padding: 12px 35px;
    margin-top: 30px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: white;
    border-radius: 50px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    z-index: 10;
}

#playBtn:hover {
    background: white;
    color: var(--space-deep);
    box-shadow: 0 0 20px white;
}

footer {
    position: absolute;
    bottom: 20px;
    font-size: 0.8em;
    opacity: 0.5;
}
</style>
</head>

<body>

<div id="intro">EXPLORING THE COSMOS...</div>

<video id="bg-video" autoplay muted loop playsinline>
    <source src="YOUR_VIDEO_FILE_HERE.mp4" type="video/mp4">
</video>

<div class="moon"></div>

<h1 class="name">
  <span style="--i:1">N</span><span style="--i:2">i</span><span style="--i:3">m</span><span style="--i:4">e</span><span style="--i:5">s</span><span style="--i:6">h</span><span style="--i:7">i</span><span style="--i:8">k</span><span style="--i:9">a</span>
</h1>

<h2>Happy 4 Months</h2>
<p>Our brightest star in the universe 🌌</p>

<button id="playBtn">✨ Activate Serenity ✨</button>

<iframe id="yt" width="1" height="1" style="opacity:0; position:absolute;" src="" allow="autoplay"></iframe>

<footer>
Wonderful World • Made with Love 💖
</footer>

<script>
/* Play Music */
document.getElementById("playBtn").onclick = function() {
    document.getElementById("yt").src = "https://www.youtube.com/embed/WJ3-F02-F_Y?autoplay=1";
    this.innerHTML = "Playing Harmony...";
    this.style.opacity = "0.5";
};

/* Create Dynamic Starfield */
function createStars() {
    const starCount = 150;
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement("div");
        star.className = "star";
        const size = Math.random() * 3 + "px";
        star.style.width = size;
        star.style.height = size;
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";
        star.style.setProperty('--duration', (Math.random() * 3 + 2) + "s");
        document.body.appendChild(star);
    }
}

createStars();
</script>

</body>
</html>
