
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nimeshika • Wonderful World</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #ffe6f0, #cdb4db);
    overflow-x: hidden;
    color: white;
    text-align: center;
}

/* Intro */
#intro {
    position: fixed;
    inset: 0;
    background: linear-gradient(120deg, #ffafcc, #cdb4db);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5em;
    z-index: 10;
    animation: fadeOut 4s forwards;
}

@keyframes fadeOut {
    0%,70% { opacity: 1; }
    100% { opacity: 0; visibility: hidden; }
}

/* Stars */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    animation: fall 6s linear infinite;
}

@keyframes fall {
    from { transform: translateY(-10vh); opacity: 1; }
    to { transform: translateY(110vh); opacity: 0; }
}

/* Headings */
h1 {
    margin-top: 80px;
    font-size: 3em;
    text-shadow: 0 0 20px #fff;
}

h2 {
    font-weight: 300;
}

/* Slider */
.slider {
    display: flex;
    overflow-x: auto;
    gap: 20px;
    padding: 40px;
    scroll-snap-type: x mandatory;
}

.slide {
    min-width: 250px;
    scroll-snap-align: center;
}

.slide img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

/* Music */
iframe {
    margin: 30px;
    border-radius: 20px;
}

footer {
    padding: 30px;
    opacity: 0.8;
}
</style>
</head>

<body>

<!-- Intro -->
<div id="intro">✨ Welcome to Nimeshika’s Wonderful World ✨</div>

<!-- Stars -->
<script>
for(let i=0;i<40;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDelay=Math.random()*5+"s";
  document.body.appendChild(s);
}
</script>

<h1>Happy 4 Months 🎀</h1>
<h2>Baby Girl Nimeshika 💕</h2>
<p>A dreamy journey of love & smiles 🌸</p>

<!-- Month Slider -->
<div class="slider">
  <div class="slide"><img src="photos/month1.jpg"><p>Month 1 🌙</p></div>
  <div class="slide"><img src="photos/month2.jpg"><p>Month 2 🌸</p></div>
  <div class="slide"><img src="photos/month3.jpg"><p>Month 3 ⭐</p></div>
  <div class="slide"><img src="photos/month4.jpg"><p>Month 4 🎉</p></div>
</div>

<!-- Music -->
<h2>🎵 Tap to Play Music</h2>
<iframe width="320" height="180"
src="https://www.youtube.com/embed/WJ3-F02-F_Y"
allowfullscreen>
</iframe>

<footer>
Made with endless love 💖<br>
Wonderful World ✨
</footer>

</body>
</html>
